# 앱 4개 — values.yaml 의 apps 표를 돌며 Deployment(+ 본 포트가 있으면 Service)를 만든다
# 앱이 기대하는 값(backend/docs/architecture.md "앱이 배포에 기대하는 것"): 포트 · 바인딩 0.0.0.0 · 서비스 주소 · 인스턴스 ID 비움(파드 이름) · 지표 · 헬스 체크 9464 · 공용 파일 폴더 · TZ
{{- range $name, $app := .Values.apps }}
{{- if lt (int $app.replicasMin) 1 }}
{{- fail (printf "%s: 최소 대수(_REPLICAS_MIN)는 1 이상이어야 합니다" $name) }}
{{- end }}
{{- if gt (int $app.replicasMin) (int $app.replicasMax) }}
{{- fail (printf "%s: 최소 대수(%v)가 최대 대수(%v)보다 큽니다" $name $app.replicasMin $app.replicasMax) }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "backend.labels" $name | nindent 4 }}
spec:
  {{- if eq (int $app.replicasMin) (int $app.replicasMax) }}
  # 최소 = 최대 — 이 대수로 고정(HPA 없음)
  replicas: {{ $app.replicasMin }}
  {{- end }}
  {{- /* 최소 < 최대면 replicas 를 두지 않는다 — 대수는 HPA(hpa.yaml)가 정하고, 설치를 다시 해도 줄지 않는다 */}}
  selector:
    matchLabels:
      {{- include "backend.selector" $name | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "backend.labels" $name | nindent 8 }}
      annotations:
        deskless/config-hash: {{ $.Values.configHash | quote }}
    spec:
      # 종료 신호 → preStop 대기(Service 에서 빠질 시간) → 앱 종료(준비 상태 503 · 연결 정리)
      terminationGracePeriodSeconds: 40
      {{- if $app.files }}
      initContainers:
        # 공용 파일 폴더(노드 폴더)는 root 소유로 만들어진다 — 앱(node 사용자)이 쓸 수 있게 소유자를 맞춘다
        - name: files-owner
          image: {{ include "backend.image" (dict "root" $ "app" $name) }}
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
          command: ['sh', '-c', 'chown node:node /app/storage/files']
          volumeMounts:
            - name: files
              mountPath: /app/storage/files
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "backend.image" (dict "root" $ "app" $name) }}
          imagePullPolicy: IfNotPresent
          # 비밀이 아닌 앱 설정 — .env 의 백엔드 키(./deskless.sh 가 ConfigMap 으로)
          envFrom:
            - configMapRef:
                name: {{ $.Values.configName }}
          # 차트가 정하는 값(위 ConfigMap 보다 앞선다) + 이 앱에만 주는 비밀값
          env:
            - name: TZ
              value: {{ $.Values.timeZone | quote }}
            - name: METRICS_HOST
              value: '0.0.0.0'
            - name: {{ $app.metricsPortEnv }}
              value: '9464'
            {{- if $app.port }}
            - name: {{ $app.portEnv }}
              value: {{ $app.port | quote }}
            {{- end }}
            {{- if $app.hostEnv }}
            - name: {{ $app.hostEnv }}
              value: '0.0.0.0'
            {{- end }}
            - name: USER_SERVICE_URL
              value: http://user-service:3010
            - name: ADMIN_SERVICE_URL
              value: http://admin-service:3020
            {{- if $app.files }}
            - name: FILE_STORAGE_DIR
              value: /app/storage/files
            {{- end }}
            {{- range $app.secretKeys }}
            {{- include "backend.secretEnv" (dict "root" $ "key" .) | nindent 12 }}
            {{- end }}
          ports:
            {{- if $app.port }}
            - name: http
              containerPort: {{ $app.port }}
            {{- end }}
            - name: metrics
              containerPort: 9464
          # 헬스 체크는 지표 전용 포트(본 포트의 내부 토큰 · API 로그와 섞이지 않는다) — 준비 판단은 앱 상태만(DB · 브로커 · Redis 는 보지 않는다)
          startupProbe:
            httpGet: {path: /health/live, port: metrics}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /health/ready, port: metrics}
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health/live, port: metrics}
            periodSeconds: 10
            failureThreshold: 6
          lifecycle:
            preStop:
              exec:
                command: ['sleep', '5']
          resources:
            requests:
              cpu: {{ printf "%vm" $app.cpuMilli }}
              memory: {{ $app.memory }}
          {{- if $app.files }}
          volumeMounts:
            - name: files
              mountPath: /app/storage/files
          {{- end }}
      {{- if $app.files }}
      volumes:
        - name: files
          hostPath:
            path: {{ printf "%s/files" (trimSuffix "/" $.Values.dataDir) }}
            type: DirectoryOrCreate
      {{- end }}
{{- if $app.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "backend.labels" $name | nindent 4 }}
spec:
  {{- if and (eq $name "gateway") $.Values.gateway.expose }}
  # 로컬 — k3s servicelb 로 노드 3000(k3d 가 PC 의 LOCAL_GATEWAY_PORT 로 넘긴다)
  type: LoadBalancer
  {{- else }}
  type: ClusterIP
  {{- end }}
  selector:
    {{- include "backend.selector" $name | nindent 4 }}
  ports:
    - name: http
      port: {{ $app.port }}
      targetPort: http
{{- end }}
{{- end }}
