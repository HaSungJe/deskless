# 마이그레이션 — 설치 · 업그레이드마다 앱보다 먼저 한 번(사용자 결정 2026-11-23 — 옛 compose 의 migrate 와 같다, 이미 적용된 건 건너뛴다)
# 실패하면 Helm 설치가 멈추고 앱은 바뀌지 않는다
apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrate
  labels:
    {{- include "backend.labels" "backend-migrate" | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    {{- include "backend.migratePod" . | nindent 4 }}
---
# 손으로 돌리는 마이그레이션의 틀 — 멈춰 둔 CronJob(정해진 시각에 돌지 않는다). ./deskless.sh backend migrate 가 여기서 Job 을 만든다
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backend-migrate
  labels:
    {{- include "backend.labels" "backend-migrate" | nindent 4 }}
spec:
  schedule: '0 0 1 1 *'
  suspend: true
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        {{- include "backend.labels" "backend-migrate" | nindent 8 }}
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        {{- include "backend.migratePod" . | nindent 8 }}
