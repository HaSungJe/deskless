# 프론트 공개 주소(운영) — WEB_HOST 가 있을 때만. 게이트웨이는 다른 주소(사용자 결정 2026-11-23 — api.<도메인> · <도메인>)
{{- if .Values.web.host }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  labels:
    {{- include "web.labels" . | nindent 4 }}
spec:
  {{- with .Values.web.ingressClass }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.web.tlsSecret }}
  tls:
    - hosts: [{{ $.Values.web.host | quote }}]
      secretName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.web.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
{{- end }}
