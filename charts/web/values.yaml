# 기본값 — 환경마다 다른 값은 ./deskless.sh 가 .env 에서 넘긴다(아래 주석의 키). 로컬 · 운영 파일을 나누지 않는다(docs/kubernetes.md)

# 이미지 — deskless/web:<태그>. ./deskless.sh 가 frontend/ 커밋 + 빌드 값 해시로 빌드하고 태그를 넘긴다(NEXT_PUBLIC_* 는 빌드 때 박힌다)
imageRepo: deskless
imageTag: local

# 설정 · 비밀값 해시 — ./deskless.sh 가 넘긴다. 바뀌면 파드가 새 값으로 다시 뜬다
configHash: ''

# ./deskless.sh 가 만드는 것 — 서버에서만 쓰는 비밀값(Secret)과 비밀이 아닌 실행 값(ConfigMap, frontend/.env.example 의 [실행] 키)
secretName: deskless-web
configName: deskless-web-env
# 이 앱에 주는 비밀값(Secret 의 키 — ./deskless.sh 의 WEB_SECRET_* 와 같게)
secretKeys: [NEXTAUTH_SECRET, KAKAO_LOGIN_SECRET_ID, NAVER_LOGIN_SECRET_ID, TOSS_SECRET_KEY]

timeZone: Asia/Seoul

# 서버(route handler)가 게이트웨이를 부르는 주소 — 클러스터 안 Service. 브라우저용 NEXT_PUBLIC_API_URL(공개 주소)은 파드 안에서 자기 자신을 가리킬 수 있어서 따로 둔다
# (프론트가 API_INTERNAL_URL 을 읽어야 쓰인다 — requests/frontend/2026-11-24-api-internal-url.md)
apiInternalUrl: http://gateway:3000

# 자동 증설 기준 — CPU 코어 1개의 몇 %(AUTOSCALE_CPU_PERCENT, 백엔드와 같은 값)
autoscale:
    cpuPercent: 70

web:
    # WEB_REPLICAS_MIN · _MAX — 다르면 HPA(CPU), 같으면 그 대수로 고정
    replicasMin: 2
    replicasMax: 4
    # 자리 잡기용 요청값(한도는 두지 않는다)
    cpuMilli: 500
    memory: 256Mi
    # WEB_EXPOSE — true 면 Service 를 LoadBalancer(k3s servicelb)로 5000 을 연다(로컬 k3d 가 PC 127.0.0.1 의 LOCAL_WEB_PORT — 기본 15000 — 로 넘긴다)
    expose: false
    # WEB_HOST — 있으면 Ingress(이 주소 → web:5000). 운영 공개 주소
    host: ''
    # INGRESS_CLASS — 비우면 클러스터 기본(k3s 는 Traefik)
    ingressClass: ''
    # WEB_TLS_SECRET — 있으면 그 TLS Secret 으로 https
    tlsSecret: ''
