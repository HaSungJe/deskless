# 로그인 문지기(nginx) 설정 — charts/dashboard 의 ConfigMap dashboard-auth 로 /etc/nginx/conf.d/default.conf 에 붙는다
# 8080 에서 받아 Basic 인증 뒤 127.0.0.1:4466(Headlamp)으로. Host 는 기본($proxy_host = 127.0.0.1:4466) 그대로 —
# Headlamp 는 127.0.0.1 에서 들을 때 Host 가 localhost · 127.0.0.1 인 요청만 받는다
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
server {
    listen 8080;
    server_tokens off;

    # 살아 있음(인증 없이 — kubelet 프로브)
    location = /-/healthz {
        access_log off;
        return 200 'ok';
    }
    # 준비됨 — Headlamp 첫 화면(정적 파일)이 열리는지(인증 없이 — kubelet 프로브)
    location = /-/ready {
        access_log off;
        proxy_pass http://127.0.0.1:4466/;
    }
    location / {
        auth_basic "deskless dashboard";
        auth_basic_user_file /etc/nginx/auth/htpasswd;

        proxy_pass http://127.0.0.1:4466;
        proxy_http_version 1.1;
        # 로그 따라 보기 · 파드 안 명령(WebSocket)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_buffering off;
        # 신원 헤더 — 로그인한 이름만, 클라이언트가 보낸 값은 덮어쓰거나 지운다(빈 값 = 넘기지 않음)
        proxy_set_header X-Forwarded-User $remote_user;
        proxy_set_header X-Forwarded-Group "";
        proxy_set_header X-Forwarded-Email "";
        proxy_set_header X-Forwarded-Id-Token "";
        # Basic 인증 값은 Headlamp 로 넘기지 않는다
        proxy_set_header Authorization "";
    }
}
