# RabbitMQ 앱 계정(gateway · user-service · admin-service) · 권한 — 설치 · 업그레이드 뒤 한 번 도는 Job(옛 compose 의 rabbitmq-init)
# 스크립트는 files/rabbitmq-init.sh(원본 backend 3125886:docker/rabbitmq/init.sh — 권한 정규식 그대로, 백엔드 npm run broker:check 가 대조한다)
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-init
  labels:
    {{- include "infra.labels" "rabbitmq-init" | nindent 4 }}
data:
  rabbitmq-init.sh: |
    {{- .Files.Get "files/rabbitmq-init.sh" | nindent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rabbitmq-init
  labels:
    {{- include "infra.labels" "rabbitmq-init" | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "infra.labels" "rabbitmq-init" | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: rabbitmq-init
          image: {{ .Values.rabbitmq.initImage }}
          command: ['/bin/sh', '/init/rabbitmq-init.sh']
          env:
            - name: RABBITMQ_API
              value: http://rabbitmq:15672/api
            {{- include "infra.secretEnv" (dict "root" $ "name" "RABBITMQ_ADMIN_USER" "key" "RABBITMQ_USER") | nindent 12 }}
            {{- include "infra.secretEnv" (dict "root" $ "name" "RABBITMQ_ADMIN_PASSWORD" "key" "RABBITMQ_PASSWORD") | nindent 12 }}
            {{- include "infra.secretEnv" (dict "root" $ "name" "RABBITMQ_GATEWAY_PASSWORD" "key" "RABBITMQ_GATEWAY_PASSWORD") | nindent 12 }}
            {{- include "infra.secretEnv" (dict "root" $ "name" "RABBITMQ_USER_SERVICE_PASSWORD" "key" "RABBITMQ_USER_SERVICE_PASSWORD") | nindent 12 }}
            {{- include "infra.secretEnv" (dict "root" $ "name" "RABBITMQ_ADMIN_SERVICE_PASSWORD" "key" "RABBITMQ_ADMIN_SERVICE_PASSWORD") | nindent 12 }}
          volumeMounts:
            - name: script
              mountPath: /init
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: rabbitmq-init
