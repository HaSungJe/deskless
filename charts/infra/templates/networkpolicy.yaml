# 네트워크 격리(인프라) — 옛 compose 의 내부 네트워크(data) 대응. 들어오는 쪽만 막는다(나가는 쪽 · DNS 는 열어 둔다)
# - 네임스페이스 기본 차단: 정책이 없는 파드는 아무도 닿지 못한다 — 각 차트가 자기 파드에 허용 규칙을 둔다(backend · web · monitoring 의 networkpolicy.yaml)
# - 인프라는 앱(백엔드 묶음 전체 — 마이그레이션 Job 포함) · 수집기 · 자기 Job 만. expose(INFRA_EXPOSE) 면 PC(npm 백엔드 · DB 도구)가 닿게 그 포트를 어디서나 연다
# - kubelet 프로브(노드에서 오는 요청)는 k3s 의 정책 컨트롤러가 막지 않는다
# 끄기: NETWORK_POLICY=0(.env) → networkPolicy.enabled=false
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels:
    {{- include "infra.labels" "default-deny" | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  labels:
    {{- include "infra.labels" "postgres" | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "infra.selector" "postgres" | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: deskless-backend
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres-exporter
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres-backup
      ports:
        - port: 5432
    {{- if .Values.expose }}
    # PC 에서(로컬 — npm 백엔드 · DB 도구)
    - ports:
        - port: 5432
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis
  labels:
    {{- include "infra.labels" "redis" | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "infra.selector" "redis" | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: deskless-backend
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis-exporter
      ports:
        - port: 6379
    {{- if .Values.expose }}
    - ports:
        - port: 6379
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq
  labels:
    {{- include "infra.labels" "rabbitmq" | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "infra.selector" "rabbitmq" | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    # 메시지 — 백엔드 앱
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: deskless-backend
      ports:
        - port: 5672
    # 관리 API — 앱 계정 · 권한 Job
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rabbitmq-init
      ports:
        - port: 15672
    # 지표 — Prometheus
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 15692
    {{- if .Values.expose }}
    # PC 에서(로컬 — npm 백엔드 · 관리 화면 · broker:check)
    - ports:
        - port: 5672
        - port: 15672
    {{- end }}
{{- end }}
