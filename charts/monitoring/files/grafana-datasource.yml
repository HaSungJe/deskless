# Grafana 데이터 원본 — 옛 backend docker/grafana/provisioning/datasources/prometheus.yml(3125886) 그대로
# 차트가 ConfigMap grafana-provisioning 으로 /etc/grafana/provisioning/datasources/ 에 넣는다. 대시보드 JSON 이 uid deskless-prometheus 로 가리킨다(바꾸지 않는다)
apiVersion: 1
datasources:
    - name: Prometheus
      uid: deskless-prometheus
      type: prometheus
      access: proxy
      url: http://prometheus:9090
      isDefault: true
      editable: false
      jsonData:
          timeInterval: 15s
