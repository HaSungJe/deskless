# Prometheus — 옛 compose.monitoring.yml 의 prometheus(backend 3125886) 그대로: 같은 이미지 · 인자 · 15초 수집 · 기록 규칙, 데이터는 노드 고정 폴더
# 설정은 files/prometheus.yml · files/rules.yml(원본 docker/prometheus/) — 내용 해시를 파드 주석에 넣어 바뀌면 다시 뜬다
# 노드 폴더 하나를 쓰므로 1대 · Recreate(옛 파드가 내려간 뒤 새 파드 — 데이터 폴더 잠금이 겹치지 않게)
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    {{- include "monitoring.labels" "prometheus" | nindent 4 }}
data:
  prometheus.yml: |-
    {{- .Files.Get "files/prometheus.yml" | nindent 4 }}
  rules.yml: |-
    {{- .Files.Get "files/rules.yml" | nindent 4 }}
---
# 확인용 — 클러스터 안 http://prometheus:9090(Grafana 데이터 원본), expose 면 노드 9090(로컬 k3d 는 PC 127.0.0.1:19090)
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    {{- include "monitoring.labels" "prometheus" | nindent 4 }}
spec:
  type: {{ include "monitoring.serviceType" . }}
  selector:
    {{- include "monitoring.selector" "prometheus" | nindent 4 }}
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    {{- include "monitoring.labels" "prometheus" | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "monitoring.selector" "prometheus" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "monitoring.labels" "prometheus" | nindent 8 }}
      annotations:
        checksum/config: {{ printf "%s\n%s" (.Files.Get "files/prometheus.yml") (.Files.Get "files/rules.yml") | sha256sum }}
    spec:
      # 같은 네임스페이스의 파드 목록을 읽는 계정(prometheus-rbac.yaml) — 앱 파드 찾기
      serviceAccountName: prometheus
      # Service 주소 env(PROMETHEUS_PORT 등)를 넣지 않는다 — 옛 compose 처럼 인자만
      enableServiceLinks: false
      initContainers:
        # 노드 폴더는 root 소유로 만들어진다 — Prometheus(nobody 65534)가 쓸 수 있게 소유자를 맞춘다(같은 이미지의 busybox chown)
        - name: data-owner
          image: {{ .Values.prometheus.image }}
          securityContext:
            runAsUser: 0
          command: ['chown', '65534:65534', '/prometheus']
          volumeMounts:
            - name: data
              mountPath: /prometheus
      containers:
        - name: prometheus
          image: {{ .Values.prometheus.image }}
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            # 보존 기간 — 7일 판정 · 7일 시간대 칸 + 한 달 추이
            - '--storage.tsdb.retention.time={{ required "prometheus.retention(PROMETHEUS_RETENTION)이 필요합니다" .Values.prometheus.retention }}'
          ports:
            - name: http
              containerPort: 9090
          # 준비됨은 WAL 을 다 읽은 뒤(/-/ready), 살아 있음은 프로세스 응답(/-/healthy — WAL 을 읽는 중에도 200)
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /-/healthy, port: http}
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.prometheus.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        {{- include "monitoring.hostPathVolume" (dict "root" $ "name" "data" "path" "prometheus") | nindent 8 }}
