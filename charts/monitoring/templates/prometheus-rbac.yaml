# Prometheus 권한 — 옛 compose 의 Docker DNS 찾기(backend 3125886 docker/prometheus/prometheus.yml 의 dns_sd_configs) 자리
# 같은 네임스페이스의 파드 목록만 읽는다(kubernetes_sd_configs role: pod · own_namespace) — 클러스터 전체 권한은 두지 않는다
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  labels:
    {{- include "monitoring.labels" "prometheus" | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
  labels:
    {{- include "monitoring.labels" "prometheus" | nindent 4 }}
rules:
  - apiGroups: ['']
    resources: [pods, services, endpoints]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
  labels:
    {{- include "monitoring.labels" "prometheus" | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: {{ .Release.Namespace }}
